
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Times Exam Bank | 영어타임즈 시험자료실</title>
<style>
:root {
  --orange:#e97828;
  --dark:#17243b;
  --muted:#64748b;
  --line:#e2e8f0;
  --bg:#f6f8fc;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--dark);
  font-family:Arial,"Malgun Gothic",sans-serif;
}
a{text-decoration:none;color:inherit}
header{
  background:white;
  border-bottom:1px solid var(--line);
  padding:18px 5%;
}
.nav{
  max-width:1180px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:14px;
}
.brand{font-size:22px;font-weight:800}
.brand span{color:var(--orange)}
nav{display:flex;gap:18px;flex-wrap:wrap}
nav a{font-size:14px;font-weight:600}
.hero{
  background:linear-gradient(125deg,#17243b,#29466a);
  color:white;
  padding:65px 20px;
  text-align:center;
}
.hero h1{font-size:clamp(27px,5vw,42px);margin:0 0 15px}
.hero p{color:#dce5f1;line-height:1.7}
.container{max-width:1180px;margin:auto;padding:30px 18px 65px}
.panel{
  background:white;
  border:1px solid var(--line);
  border-radius:15px;
  padding:25px;
  margin-bottom:24px;
}
h2{margin:0 0 18px;font-size:22px}
.filters{
  display:grid;
  grid-template-columns:2fr repeat(3,1fr);
  gap:12px;
}
input,select{
  width:100%;
  padding:13px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  background:white;
  font-size:15px;
}
button,.button{
  background:var(--orange);
  color:white;
  border:0;
  border-radius:8px;
  padding:12px 18px;
  cursor:pointer;
  display:inline-block;
  font-weight:700;
}
.secondary{background:#475569}
.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  margin:18px 0;
}
#results{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:17px;
}
.card{
  background:white;
  border:1px solid var(--line);
  border-radius:13px;
  padding:21px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.card h3{
  margin:0;
  font-size:17px;
  line-height:1.5;
  overflow-wrap:anywhere;
}
.meta{font-size:13px;color:var(--muted);line-height:1.8}
.tag{
  display:inline-block;
  background:#fff0e4;
  color:#a94d12;
  padding:5px 9px;
  border-radius:6px;
  font-size:12px;
  font-weight:700;
  align-self:flex-start;
}
.card .button{
  margin-top:auto;
  text-align:center;
}
.message{
  grid-column:1/-1;
  background:white;
  padding:35px;
  text-align:center;
  border-radius:12px;
  color:var(--muted);
}
footer{
  padding:28px 15px;
  text-align:center;
  background:var(--dark);
  color:#dce5f1;
  font-size:13px;
}
@media(max-width:900px){
  .filters{grid-template-columns:1fr 1fr}
  #results{grid-template-columns:1fr 1fr}
}
@media(max-width:600px){
  .filters{grid-template-columns:1fr}
  #results{grid-template-columns:1fr}
  .panel{padding:17px}
}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="brand" href="./index.html">
      <span>English Times</span> Exam Bank
    </a>
    <nav>
      <a href="./index.html">홈</a>
      <a href="./resources.html">시험자료실</a>
      <a href="https://englishtimes.co.kr/"
         target="_blank" rel="noopener">영어타임즈어학원</a>
      <a href="https://english-times-admin-api.kdstarmoon.workers.dev/">
        관리자
      </a>
    </nav>
  </div>
</header>

<section class="hero">
  <h1>영어 시험자료를 한곳에서</h1>
  <p>
    학교별 · 학년별 · 시험별 영어 학습자료 검색<br>
    English Times Exam Bank
  </p>
</section>

<main class="container">

  <section class="panel">
    <h2>시험자료 검색</h2>
    <div class="filters">
      <input id="keyword" placeholder="학교명 또는 자료 제목 검색"
             aria-label="학교명 또는 자료 제목 검색">

      <select id="level" aria-label="학교급">
        <option value="">전체 학교급</option>
        <option value="elementary">초등학교</option>
        <option value="middle">중학교</option>
        <option value="high">고등학교</option>
        <option value="other">기타</option>
      </select>

      <select id="grade" aria-label="학년">
        <option value="">전체 학년</option>
        <option value="1">1학년</option>
        <option value="2">2학년</option>
        <option value="3">3학년</option>
        <option value="4">4학년</option>
        <option value="5">5학년</option>
        <option value="6">6학년</option>
      </select>

      <select id="exam" aria-label="시험 종류">
        <option value="">전체 시험</option>
        <option value="mid">중간고사</option>
        <option value="final">기말고사</option>
        <option value="mock">모의고사·수능</option>
        <option value="other">기타 자료</option>
      </select>
    </div>

    <div style="margin-top:15px">
      <button id="reset">검색 초기화</button>
    </div>
  </section>

  <div class="toolbar">
    <h2 style="margin:0">공개 시험자료</h2>
    <div id="count" aria-live="polite">자료 불러오는 중...</div>
  </div>

  <div id="results">
    <div class="message">승인된 자료를 불러오는 중입니다.</div>
  </div>

  <div style="text-align:center;margin-top:25px">
    <button id="more" class="secondary" hidden>자료 더 보기</button>
  </div>

</main>

<footer>
  English Times Language Academy<br>
  LEARN TODAY GROW TOMORROW<br>
  © English Times Exam Bank
</footer>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const fields = ["keyword","level","grade","exam"];
  const PAGE_SIZE = 30;

  let records = [];
  let visible = [];
  let shown = 0;
  let loadError = "";

  const labels = {
    elementary:"초등학교",
    middle:"중학교",
    high:"고등학교",
    other:"기타",
    mid:"중간고사",
    final:"기말고사",
    mock:"모의고사·수능"
  };

  function clean(value) {
    return String(value ?? "").trim();
  }

  function validUrl(value) {
    try {
      const url = new URL(value, location.href);
      return ["https:","http:"].includes(url.protocol)
        ? url.href : null;
    } catch {
      return null;
    }
  }

  function textElement(tag, value, className) {
    const element = document.createElement(tag);
    element.textContent = value;
    if (className) element.className = className;
    return element;
  }

  function createCard(item) {
    const card = document.createElement("article");
    card.className = "card";

    const type = clean(item.resource_type);
    const filename = clean(item.filename).toLowerCase();
    const format = type === "file"
      ? (filename.endsWith(".pdf") ? "PDF"
        : filename.endsWith(".docx") ? "Word"
        : filename.endsWith(".doc") ? "Word" : "파일")
      : type === "pdf" ? "PDF 링크" : "자료 링크";

    card.appendChild(textElement("span", format, "tag"));
    card.appendChild(textElement(
      "h3", clean(item.title) || clean(item.filename) || "제목 없음"
    ));

    const details = [
      clean(item.school_name),
      labels[clean(item.school_level)] || "",
      clean(item.grade) ? clean(item.grade) + "학년" : "",
      clean(item.year) ? clean(item.year) + "년" : "",
      labels[clean(item.exam_type)] || "기타 자료"
    ].filter(Boolean);

    card.appendChild(textElement("div", details.join(" · "), "meta"));

    const link = validUrl(item.url);
    if (link) {
      const a = document.createElement("a");
      a.href = link;
      a.className = "button";
      a.textContent = type === "file" ? "파일 다운로드" : "자료 열기";
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      card.appendChild(a);
    } else {
      card.appendChild(textElement("div", "자료 링크 확인 필요", "meta"));
    }
    return card;
  }

  function renderMore() {
    const end = Math.min(shown + PAGE_SIZE, visible.length);
    const fragment = document.createDocumentFragment();

    for (let i = shown; i < end; i++) {
      fragment.appendChild(createCard(visible[i]));
    }
    $("results").appendChild(fragment);
    shown = end;
    $("more").hidden = shown >= visible.length;
  }

  function filterRecords() {
    const keyword = clean($("keyword").value).toLowerCase();
    const level = $("level").value;
    const grade = $("grade").value;
    const exam = $("exam").value;

    visible = records.filter(item => {
      const haystack = [
        item.title, item.filename, item.school_name,
        item.year, item.source
      ].map(clean).join(" ").toLowerCase();

      return (!keyword || haystack.includes(keyword)) &&
        (!level || clean(item.school_level) === level) &&
        (!grade || clean(item.grade) === grade) &&
        (!exam || clean(item.exam_type) === exam);
    });

    $("count").textContent = visible.length + "개 자료";
    $("results").replaceChildren();
    shown = 0;

    if (!visible.length) {
      $("results").appendChild(textElement(
        "div",
        loadError || "검색 조건에 맞는 자료가 없습니다.",
        "message"
      ));
      $("more").hidden = true;
      return;
    }
    renderMore();
  }

  async function load() {
    $("count").textContent = "자료 불러오는 중...";
    try {
      const response = await fetch(
        "./approved.json?v=" + Date.now(),
        {cache:"no-store"}
      );
      if (!response.ok) throw Error("HTTP " + response.status);

      const data = await response.json();
      if (!Array.isArray(data)) {
        throw Error("approved.json은 배열 형식이어야 합니다.");
      }

      records = data.filter(item =>
        item && typeof item === "object" &&
        item.status !== "rejected" &&
        item.status !== "pending" &&
        Boolean(validUrl(item.url))
      );

      records.reverse();
      loadError = "";
    } catch (error) {
      records = [];
      loadError = "자료를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.";
      console.error("Exam Bank 자료 로딩 실패:", error);
    }
    filterRecords();
  }

  for (const id of fields) {
    $(id).addEventListener(
      id === "keyword" ? "input" : "change",
      filterRecords
    );
  }

  $("reset").addEventListener("click", () => {
    for (const id of fields) $(id).value = "";
    filterRecords();
  });

  $("more").addEventListener("click", renderMore);

  load();
})();
</script>
</body>
</html>
