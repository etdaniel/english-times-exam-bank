<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공식 자료 링크 | English Times Exam Bank</title><style>body{font:16px 'Malgun Gothic',sans-serif;background:#f7f8fa;color:#222;margin:0}main{max-width:850px;margin:30px auto;padding:22px;background:white;border-radius:16px}a{color:#a51d2d}li{margin:14px 0;padding:12px;border-bottom:1px solid #eee}input{padding:12px;width:95%;border:1px solid #ddd;border-radius:8px}small{color:#777}</style></head><body><main><a href="index.html">← 홈으로</a><h1>공식 시험자료 링크</h1><p>관리자가 확인하고 승인한 외부 자료 링크만 표시됩니다. 자료의 저작권은 원 권리자에게 있습니다.</p><input id="q" placeholder="자료명 검색" aria-label="자료명 검색"><ul id="list"></ul><p id="state"></p></main><script>let data=[];const q=document.getElementById('q'),list=document.getElementById('list'),state=document.getElementById('state');function render(){list.replaceChildren();const rows=data.filter(x=>x.title.toLowerCase().includes(q.value.toLowerCase()));for(const x of rows){const li=document.createElement('li'),a=document.createElement('a');a.textContent=x.title;a.href=x.url;a.target='_blank';a.rel='noopener noreferrer';li.append(a);list.append(li)}state.textContent=rows.length+'개 자료 표시'}q.addEventListener('input',render);fetch('approved.json').then(r=>{if(!r.ok)throw Error('로드 실패');return r.json()}).then(x=>{data=x;render()}).catch(()=>{state.textContent='자료 목록을 불러올 수 없습니다. GitHub Pages에서 접속해 주세요.'});</script></body></html>
