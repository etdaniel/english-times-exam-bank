
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>공식 시험자료 링크 | English Times Exam Bank</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font: 16px 'Malgun Gothic', sans-serif;
  background: #f7f8fa;
  color: #222;
  margin: 0;
}

main {
  max-width: 950px;
  margin: 30px auto;
  padding: 25px;
  background: white;
  border-radius: 16px;
}

a {
  color: #a51d2d;
}

h1 {
  margin-bottom: 12px;
}

.description {
  color: #666;
  line-height: 1.7;
}

.search-box {
  background: #f8f9fb;
  padding: 20px;
  border-radius: 12px;
  margin: 24px 0;
}

.search-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
  margin-top: 15px;
}

label {
  display: block;
  font-weight: bold;
  font-size: 14px;
  margin-bottom: 6px;
}

input, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  background: white;
  font-size: 15px;
}

button {
  padding: 11px 18px;
  border: 0;
  border-radius: 8px;
  background: #a51d2d;
  color: white;
  cursor: pointer;
  margin-top: 16px;
}

button:hover {
  background: #831624;
}

ul {
  list-style: none;
  padding: 0;
}

li {
  margin: 12px 0;
  padding: 18px;
  border: 1px solid #eee;
  border-radius: 10px;
}

li a {
  font-weight: bold;
  text-decoration: none;
  line-height: 1.6;
}

li a:hover {
  text-decoration: underline;
}

.meta {
  color: #777;
  font-size: 13px;
  margin-top: 9px;
  line-height: 1.7;
}

#state {
  font-weight: bold;
  color: #a51d2d;
}

.empty {
  color: #777;
  padding: 25px;
  text-align: center;
}

@media(max-width:600px) {
  main {
    margin: 0;
    padding: 18px;
    border-radius: 0;
  }

  .search-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>
<main>

<a href="index.html">← 홈으로</a>

<h1>English Times Exam Bank</h1>
<h2>공식 시험자료 검색</h2>

<p class="description">
관리자가 확인하고 승인한 외부 시험자료 링크만 표시됩니다.
자료의 저작권은 원 권리자에게 있습니다.
</p>

<section class="search-box">

<label for="q">학교명 또는 시험자료명 검색</label>

<input
  id="q"
  placeholder="예: 나래중, 중3, 2026 기말고사"
  aria-label="학교명 또는 자료명 검색"
>

<div class="search-grid">

<div>
  <label for="school">학교급</label>
  <select id="school">
    <option value="">전체 학교급</option>
    <option value="elementary">초등학교</option>
    <option value="middle">중학교</option>
    <option value="high">고등학교</option>
  </select>
</div>

<div>
  <label for="grade">학년</label>
  <select id="grade">
    <option value="">전체 학년</option>
  </select>
</div>

<div>
  <label for="exam">시험 종류</label>
  <select id="exam">
    <option value="">전체 시험</option>
    <option value="mid">중간고사</option>
    <option value="final">기말고사</option>
    <option value="mock">모의고사·수능</option>
    <option value="other">기타 자료</option>
  </select>
</div>

<div>
  <label for="year">시험 연도</label>
  <select id="year">
    <option value="">전체 연도</option>
  </select>
</div>

</div>

<button id="reset" type="button">
  검색 초기화
</button>

</section>

<h2>시험자료 목록</h2>

<p id="state" role="status">
  자료를 불러오는 중입니다...
</p>

<ul id="list"></ul>

</main>

<script>
let data = [];

const q = document.getElementById('q');
const school = document.getElementById('school');
const grade = document.getElementById('grade');
const exam = document.getElementById('exam');
const year = document.getElementById('year');
const list = document.getElementById('list');
const state = document.getElementById('state');
const reset = document.getElementById('reset');

function text(value) {
  return String(value ?? '');
}

function normalized(value) {
  return text(value)
    .toLowerCase()
    .replace(/\s+/g, '');
}

// 학교급 분류
// 관리자가 입력한 값을 우선 사용합니다.
function getSchool(item) {
  const explicit = normalized(item.school_level);

  if (
    explicit === 'elementary' ||
    explicit === 'elementaryschool'
  ) {
    return 'elementary';
  }

  if (
    explicit === 'middle' ||
    explicit === 'middleschool'
  ) {
    return 'middle';
  }

  if (
    explicit === 'high' ||
    explicit === 'highschool'
  ) {
    return 'high';
  }

  // 기타·전국 공통으로 지정한 자료는
  // 제목에서 학교급을 추측하지 않습니다.
  if (explicit === 'other') {
    return '';
  }

  const s = normalized([
    item.school_name,
    item.school_type,
    item.school,
    item.title
  ].join(' '));

  if (
    /초등|초[1-6]|elementary/.test(s)
  ) {
    return 'elementary';
  }

  if (
    /중학교|중[1-3]|중등|middle/.test(s)
  ) {
    return 'middle';
  }

  if (
    /고등|고[1-3]|고교|highschool/.test(s)
  ) {
    return 'high';
  }

  return '';
}

// 학년 분류
function getGrade(item) {
  const explicit = text(item.grade).trim();

  if (/^[1-6]$/.test(explicit)) {
    return explicit;
  }

  const s = normalized([
    item.title,
    item.school_name
  ].join(' '));

  const match = s.match(
    /(?:초등학교|초등|초|중학교|중등|중|고등학교|고등|고)\s*([1-6])(?:학년)?/
  );

  return match ? match[1] : '';
}

// 시험 종류 분류
// mid, midterm 모두 인식합니다.
function getExam(item) {
  const explicit = normalized(item.exam_type);

  if (
    explicit === 'mid' ||
    explicit === 'midterm'
  ) {
    return 'mid';
  }

  if (explicit === 'final') {
    return 'final';
  }

  if (
    explicit === 'mock' ||
    explicit === 'mockexam'
  ) {
    return 'mock';
  }

  if (explicit === 'other') {
    return 'other';
  }

  const s = normalized([
    item.exam,
    item.title
  ].join(' '));

  if (
    /중간고사|중간시험|중간평가|midterm/.test(s)
  ) {
    return 'mid';
  }

  if (
    /기말고사|기말시험|기말평가|final/.test(s)
  ) {
    return 'final';
  }

  if (
    /모의고사|모의평가|학력평가|수능|대학수학능력시험|mock/.test(s)
  ) {
    return 'mock';
  }

  return 'other';
}

// 시험 연도 분류
function getYear(item) {
  const explicit = text(item.year).trim();

  if (/^(19|20)\d{2}$/.test(explicit)) {
    return explicit;
  }

  const match = text(item.title).match(
    /(?:19|20)\d{2}/
  );

  return match ? match[0] : '';
}

// 학교 이름
function getSchoolName(item) {
  return text(
    item.school_name || item.school || ''
  ).trim();
}

// 학년 선택 목록 갱신
function updateGrades() {
  const previous = grade.value;

  grade.replaceChildren();

  const all = document.createElement('option');
  all.value = '';
  all.textContent = '전체 학년';
  grade.append(all);

  const max =
    school.value === 'middle' ||
    school.value === 'high'
      ? 3
      : 6;

  for (let i = 1; i <= max; i++) {
    const option = document.createElement('option');

    option.value = String(i);
    option.textContent = i + '학년';

    grade.append(option);
  }

  if (
    previous &&
    Number(previous) <= max
  ) {
    grade.value = previous;
  }
}

// 연도 목록 갱신
function updateYears() {
  const years = [
    ...new Set(
      data.map(getYear).filter(Boolean)
    )
  ].sort(
    (a, b) => Number(b) - Number(a)
  );

  year.replaceChildren();

  const all = document.createElement('option');
  all.value = '';
  all.textContent = '전체 연도';

  year.append(all);

  for (const y of years) {
    const option = document.createElement('option');

    option.value = y;
    option.textContent = y + '년';

    year.append(option);
  }
}

// 외부 링크 검증
function safeUrl(value) {
  try {
    const url = new URL(text(value));

    if (
      url.protocol === 'https:' ||
      url.protocol === 'http:'
    ) {
      return url.href;
    }
  } catch (error) {}

  return null;
}

// 자료 표시 순서
// 시험 연도가 최신인 자료를 먼저 표시합니다.
function sortResources(items) {
  return [...items].sort((a, b) => {
    const yearA = Number(getYear(a)) || 0;
    const yearB = Number(getYear(b)) || 0;

    if (yearA !== yearB) {
      return yearB - yearA;
    }

    const dateA = Date.parse(
      text(a.reviewed_on || a.found_on)
    ) || 0;

    const dateB = Date.parse(
      text(b.reviewed_on || b.found_on)
    ) || 0;

    return dateB - dateA;
  });
}

// 검색 결과 출력
function render() {
  list.replaceChildren();

  const keyword = normalized(q.value);

  const filtered = data.filter(item => {
    const searchText = normalized([
      item.title,
      item.school,
      item.school_name,
      item.school_level,
      item.source_query,
      item.year,
      item.grade,
      item.exam_type
    ].join(' '));

    if (
      keyword &&
      !searchText.includes(keyword)
    ) {
      return false;
    }

    if (
      school.value &&
      getSchool(item) !== school.value
    ) {
      return false;
    }

    if (
      grade.value &&
      getGrade(item) !== grade.value
    ) {
      return false;
    }

    if (
      exam.value &&
      getExam(item) !== exam.value
    ) {
      return false;
    }

    if (
      year.value &&
      getYear(item) !== year.value
    ) {
      return false;
    }

    return true;
  });

  const rows = sortResources(filtered);

  const schoolNames = {
    elementary: '초등학교',
    middle: '중학교',
    high: '고등학교'
  };

  const examNames = {
    mid: '중간고사',
    final: '기말고사',
    mock: '모의고사·수능',
    other: '기타 자료'
  };

  for (const item of rows) {
    const li = document.createElement('li');
    const a = document.createElement('a');

    a.textContent =
      text(item.title) || '제목 없는 자료';

    const href = safeUrl(item.url);

    if (href) {
      a.href = href;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      li.append(a);
    } else {
      li.textContent = a.textContent;
    }

    const meta = document.createElement('div');
    meta.className = 'meta';

    const details = [];

    const schoolName = getSchoolName(item);
    const schoolLevel = getSchool(item);
    const itemGrade = getGrade(item);
    const itemYear = getYear(item);
    const itemExam = getExam(item);

    if (schoolName) {
      details.push(schoolName);
    }

    if (schoolLevel) {
      details.push(schoolNames[schoolLevel]);
    }

    if (itemGrade) {
      details.push(itemGrade + '학년');
    }

    if (itemYear) {
      details.push(itemYear + '년');
    }

    details.push(examNames[itemExam]);

    const typeNames = {
      pdf: 'PDF 자료',
      official: '공식 자료 페이지',
      other: '외부 링크'
    };

    if (
      item.resource_type &&
      typeNames[item.resource_type]
    ) {
      details.push(
        typeNames[item.resource_type]
      );
    }

    meta.textContent = details.join(' · ');

    li.append(meta);
    list.append(li);
  }

  state.textContent =
    rows.length + '개 자료 표시';

  if (rows.length === 0) {
    const empty = document.createElement('li');

    empty.className = 'empty';
    empty.textContent =
      '검색 조건에 맞는 자료가 없습니다.';

    list.append(empty);
  }
}

// 검색 이벤트
q.addEventListener('input', render);

school.addEventListener('change', () => {
  grade.value = '';
  updateGrades();
  render();
});

grade.addEventListener('change', render);
exam.addEventListener('change', render);
year.addEventListener('change', render);

// 초기화 버튼
reset.addEventListener('click', () => {
  q.value = '';
  school.value = '';
  grade.value = '';
  exam.value = '';
  year.value = '';

  updateGrades();
  render();
});

// 첫 화면 설정
updateGrades();

// 승인된 자료 불러오기
fetch('approved.json', {
  cache: 'no-store'
})
.then(response => {
  if (!response.ok) {
    throw Error('자료 불러오기 실패');
  }

  return response.json();
})
.then(items => {
  if (!Array.isArray(items)) {
    throw Error('자료 형식 오류');
  }

  data = items.filter(
    item =>
      item &&
      item.status !== 'rejected'
  );

  updateYears();
  render();
})
.catch(error => {
  console.error(error);

  state.textContent =
    '자료 목록을 불러올 수 없습니다. 잠시 후 다시 시도해 주세요.';
});

</script>
</body>
</html>
