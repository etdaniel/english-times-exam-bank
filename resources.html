
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>공식 시험자료 링크 | English Times Exam Bank</title>
<style>
*{box-sizing:border-box}
body{
  font:16px 'Malgun Gothic',sans-serif;
  background:#f7f8fa;
  color:#222;
  margin:0;
}
main{
  max-width:950px;
  margin:30px auto;
  padding:25px;
  background:white;
  border-radius:16px;
}
a{color:#a51d2d}
h1{margin-bottom:12px}
.description{
  color:#666;
  line-height:1.7;
}
.search-box{
  background:#f8f9fb;
  padding:20px;
  border-radius:12px;
  margin:24px 0;
}
.search-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
  margin-top:15px;
}
label{
  display:block;
  font-weight:bold;
  font-size:14px;
  margin-bottom:6px;
}
input,select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  background:white;
  font-size:15px;
}
button{
  padding:11px 18px;
  border:0;
  border-radius:8px;
  background:#a51d2d;
  color:white;
  cursor:pointer;
  margin-top:16px;
}
ul{
  list-style:none;
  padding:0;
}
li{
  margin:12px 0;
  padding:18px;
  border:1px solid #eee;
  border-radius:10px;
}
li a{
  font-weight:bold;
  text-decoration:none;
  line-height:1.6;
}
li a:hover{text-decoration:underline}
.meta{
  color:#777;
  font-size:13px;
  margin-top:9px;
}
#state{
  font-weight:bold;
  color:#a51d2d;
}
.empty{
  color:#777;
  padding:25px;
  text-align:center;
}
@media(max-width:600px){
  main{margin:0;padding:18px;border-radius:0}
  .search-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<main>

<a href="index.html">← 홈으로</a>

<h1>English Times Exam Bank</h1>
<h2>공식 시험자료 검색</h2>

<p class="description">
관리자가 확인하고 승인한 외부 시험자료 링크만 표시됩니다.
자료의 저작권은 원 권리자에게 있습니다.
</p>

<section class="search-box">

<label for="q">학교명 또는 시험자료명 검색</label>
<input
  id="q"
  placeholder="예: 나래중, 중3, 2026 기말고사"
  aria-label="학교명 또는 자료명 검색"
>

<div class="search-grid">

<div>
<label for="school">학교급</label>
<select id="school">
<option value="">전체 학교급</option>
<option value="elementary">초등학교</option>
<option value="middle">중학교</option>
<option value="high">고등학교</option>
</select>
</div>

<div>
<label for="grade">학년</label>
<select id="grade">
<option value="">전체 학년</option>
</select>
</div>

<div>
<label for="exam">시험 종류</label>
<select id="exam">
<option value="">전체 시험</option>
<option value="mid">중간고사</option>
<option value="final">기말고사</option>
<option value="mock">모의고사</option>
<option value="other">기타 자료</option>
</select>
</div>

<div>
<label for="year">시험 연도</label>
<select id="year">
<option value="">전체 연도</option>
</select>
</div>

</div>

<button id="reset" type="button">검색 초기화</button>

</section>

<h2>시험자료 목록</h2>
<p id="state" role="status">자료를 불러오는 중입니다...</p>

<ul id="list"></ul>

</main>

<script>
let data=[];

const q=document.getElementById('q');
const school=document.getElementById('school');
const grade=document.getElementById('grade');
const exam=document.getElementById('exam');
const year=document.getElementById('year');
const list=document.getElementById('list');
const state=document.getElementById('state');
const reset=document.getElementById('reset');

function text(x){
  return String(x??'');
}

function normalized(x){
  return text(x).toLowerCase().replace(/\s+/g,'');
}

function getSchool(x){
  const s=normalized(
    [x.school_level,x.school_type,x.school,x.title]
      .join(' ')
  );

  if(/초등|초[1-6]|elementary/.test(s))
    return 'elementary';

  if(/중학교|중[1-3]|중등|middle/.test(s))
    return 'middle';

  if(/고등|고[1-3]|고교|highschool/.test(s))
    return 'high';

  return '';
}

function getGrade(x){
  const explicit=text(x.grade).match(/[1-6]/);

  if(explicit){
    return explicit[0];
  }

  const title=normalized(x.title);

  const match=title.match(
    /(?:초등학교|초등|초|중학교|중등|중|고등학교|고등|고)\s*([1-6])(?:학년)?/
  );

  if(match){
    return match[1];
  }

  return '';
}

function getExam(x){
  const s=normalized(
    [x.exam_type,x.exam,x.title].join(' ')
  );

  if(/중간고사|중간시험|중간평가|midterm/.test(s))
    return 'mid';

  if(/기말고사|기말시험|기말평가|final/.test(s))
    return 'final';

  if(/모의고사|학력평가|수능|mock/.test(s))
    return 'mock';

  return 'other';
}

function getYear(x){
  const explicit=text(x.year).match(/20\d{2}/);

  if(explicit){
    return explicit[0];
  }

  const match=text(x.title).match(/20\d{2}/);

  return match ? match[0] : '';
}

function updateGrades(){
  const previous=grade.value;

  grade.replaceChildren();

  const all=document.createElement('option');
  all.value='';
  all.textContent='전체 학년';
  grade.append(all);

  const max=school.value==='middle'||school.value==='high'
    ? 3 : 6;

  for(let i=1;i<=max;i++){
    const option=document.createElement('option');
    option.value=String(i);
    option.textContent=i+'학년';
    grade.append(option);
  }

  if(previous && Number(previous)<=max){
    grade.value=previous;
  }
}

function updateYears(){
  const years=[
    ...new Set(data.map(getYear).filter(Boolean))
  ].sort((a,b)=>Number(b)-Number(a));

  year.replaceChildren();

  const all=document.createElement('option');
  all.value='';
  all.textContent='전체 연도';
  year.append(all);

  for(const y of years){
    const option=document.createElement('option');
    option.value=y;
    option.textContent=y+'년';
    year.append(option);
  }
}

function safeUrl(value){
  try{
    const u=new URL(text(value));

    if(u.protocol==='https:'||u.protocol==='http:'){
      return u.href;
    }
  }catch(e){}

  return null;
}

function render(){
  list.replaceChildren();

  const keyword=normalized(q.value);

  const rows=data.filter(x=>{
    const searchText=normalized([
      x.title,
      x.school,
      x.school_name,
      x.source_query,
      x.year,
      x.grade
    ].join(' '));

    if(keyword && !searchText.includes(keyword))
      return false;

    if(school.value && getSchool(x)!==school.value)
      return false;

    if(grade.value && getGrade(x)!==grade.value)
      return false;

    if(exam.value && getExam(x)!==exam.value)
      return false;

    if(year.value && getYear(x)!==year.value)
      return false;

    return true;
  });

  for(const x of rows){
    const li=document.createElement('li');
    const a=document.createElement('a');

    a.textContent=text(x.title)||'제목 없는 자료';

    const href=safeUrl(x.url);

    if(href){
      a.href=href;
      a.target='_blank';
      a.rel='noopener noreferrer';
      li.append(a);
    }else{
      li.textContent=a.textContent;
    }

    const meta=document.createElement('div');
    meta.className='meta';

    const details=[];

    const schoolNames={
      elementary:'초등학교',
      middle:'중학교',
      high:'고등학교'
    };

    if(getSchool(x))
      details.push(schoolNames[getSchool(x)]);

    if(getGrade(x))
      details.push(getGrade(x)+'학년');

    if(getYear(x))
      details.push(getYear(x)+'년');

    const examNames={
      mid:'중간고사',
      final:'기말고사',
      mock:'모의고사',
      other:'기타 자료'
    };

    details.push(examNames[getExam(x)]);

    meta.textContent=details.join(' · ');

    li.append(meta);
    list.append(li);
  }

  state.textContent=rows.length+'개 자료 표시';

  if(rows.length===0){
    const empty=document.createElement('li');
    empty.className='empty';
    empty.textContent='검색 조건에 맞는 자료가 없습니다.';
    list.append(empty);
  }
}

q.addEventListener('input',render);

school.addEventListener('change',()=>{
  grade.value='';
  updateGrades();
  render();
});

grade.addEventListener('change',render);
exam.addEventListener('change',render);
year.addEventListener('change',render);

reset.addEventListener('click',()=>{
  q.value='';
  school.value='';
  grade.value='';
  exam.value='';
  year.value='';

  updateGrades();
  render();
});

updateGrades();

fetch('approved.json',{cache:'no-store'})
.then(r=>{
  if(!r.ok)throw Error('로드 실패');
  return r.json();
})
.then(items=>{
  if(!Array.isArray(items)){
    throw Error('자료 형식 오류');
  }

  data=items;
  updateYears();
  render();
})
.catch(()=>{
  state.textContent=
    '자료 목록을 불러올 수 없습니다. 잠시 후 다시 시도해 주세요.';
});

</script>
</body>
</html>
